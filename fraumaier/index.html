<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Hier entsteht eine persönliche Präsentation von Martin Thun.">
  <title>Wachstum mit Martin Thun</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10100f;
      color: #f7f3eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 20%, rgba(217, 174, 112, 0.2), transparent 32rem),
        radial-gradient(circle at 85% 80%, rgba(107, 137, 119, 0.18), transparent 28rem),
        #10100f;
    }

    main {
      width: min(760px, 100%);
      padding: clamp(32px, 7vw, 72px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.045);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(16px);
    }

    .signature-logo {
      display: block;
      width: min(360px, 74vw);
      height: auto;
      margin: 0 0 28px;
      filter: drop-shadow(0 8px 22px rgba(0, 0, 0, 0.22));
    }

    h1 {
      max-width: 12ch;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3rem, 9vw, 6.5rem);
      font-weight: 400;
      line-height: 0.94;
      letter-spacing: -0.055em;
    }

    p:last-child {
      max-width: 46ch;
      margin: 30px 0 0;
      color: rgba(247, 243, 235, 0.7);
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.65;
    }
  </style>
</head>
<body>
  <main>
    <img class="signature-logo" src="assets/frau-maier-signature.png" alt="Frau Maier">
    <h1>Etwas Großes entsteht.</h1>
    <p>Diese Seite wird gerade vorbereitet. Bald findest du hier eine persönliche Präsentation mit neuen Perspektiven für nachhaltiges Wachstum.</p>
  </main>
</body>
</html>
