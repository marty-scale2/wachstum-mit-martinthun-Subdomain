<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Präsentation für Frau Maier.">
  <meta name="theme-color" content="#ff2b21">
  <title>Frau Maier</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="deck" aria-label="Präsentation">
    <div class="track" id="track">
      <section class="slide slide-1 is-active" aria-label="Slide 1 von 5">
        <div class="slide__content">
          <img class="signature-logo" src="assets/frau-maier-signature.png" alt="Frau Maier" data-reveal style="--delay:80ms">
          <h1 class="display" data-reveal style="--delay:180ms">Platzhalter für Slide 1</h1>
          <p class="body-copy" data-reveal style="--delay:300ms">Text für Slide 1</p>
        </div>
      </section>
      <section class="slide slide-2" aria-label="Slide 2 von 5" aria-hidden="true">
        <div class="slide__content"><h2 class="display" data-reveal>Platzhalter für Slide 2</h2><p class="body-copy" data-reveal style="--delay:280ms">Text für Slide 2</p></div>
      </section>
      <section class="slide slide-3" aria-label="Slide 3 von 5" aria-hidden="true">
        <div class="slide__content"><h2 class="display" data-reveal>Platzhalter für Slide 3</h2><p class="body-copy" data-reveal style="--delay:280ms">Text für Slide 3</p></div>
      </section>
      <section class="slide slide-4" aria-label="Slide 4 von 5" aria-hidden="true">
        <div class="slide__content"><h2 class="display" data-reveal>Platzhalter für Slide 4</h2><p class="body-copy" data-reveal style="--delay:280ms">Text für Slide 4</p></div>
      </section>
      <section class="slide slide-5" aria-label="Slide 5 von 5" aria-hidden="true">
        <div class="slide__content"><h2 class="display" data-reveal>Platzhalter für Slide 5</h2><p class="body-copy" data-reveal style="--delay:280ms">Text für Slide 5</p></div>
      </section>
    </div>
  </main>
  <nav class="chrome" aria-label="Slide-Navigation">
    <div class="counter" aria-live="polite"><span id="current">01</span> / 05</div>
    <div class="progress" aria-hidden="true"><div class="progress__bar" id="progress"></div></div>
    <div class="controls">
      <button class="control" id="previous" type="button" aria-label="Vorherige Slide" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="control" id="next" type="button" aria-label="Nächste Slide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
  </nav>
  <script src="deck.js"></script>
</body>
</html>
